name: Build Game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build web
        run: |
          mkdir -p www
          npx esbuild game.js --bundle --minify --format=iife --target=chrome90 --outfile=www/game.js
          cp index.html www/
          for f in *.glb *.fbx *.png *.jpg *.jpeg *.mp3 *.ogg; do [ -e "$f" ] && cp "$f" www/; done; true
      - name: Simpan untuk APK
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
      - name: Simpan untuk Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: www
      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PenerbanganMalam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
